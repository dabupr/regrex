[workspace]
resolver = "3"
members = ["crates/regrex-core", "crates/regrex-cli"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.88"
authors = ["David Busoms"]
repository = "https://github.com/dabupr/regrex"

# The search is numeric and slow without optimisations; keep tests fast.
[profile.test]
opt-level = 3
