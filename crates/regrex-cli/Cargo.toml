[package]
name = "regrex-cli"
version.workspace = true
description = "Command-line interface for Regrex: find the formulas behind your data"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "../../README.md"
homepage = "https://dabupr.github.io/regrex/"
documentation = "https://docs.rs/regrex-cli"
keywords = ["symbolic-regression", "csv", "excel", "formula", "cli"]
categories = ["command-line-utilities", "science"]

[[bin]]
name = "regrex"
path = "src/main.rs"

[dependencies]
regrex-core = { path = "../regrex-core", version = "0.1.0" }
regrex-io = { path = "../regrex-io", version = "0.1.0", default-features = false }
clap = { version = "4.5", features = ["derive"] }
serde = "1"
serde_json = "1"

[features]
# Parquet, Arrow IPC and SQLite input. Build with --no-default-features for
# a smaller binary that reads CSV, spreadsheets and JSON only.
default = ["all-formats"]
all-formats = ["regrex-io/all-formats"]
