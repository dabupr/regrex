[[formula]]
id = "angular_frequency"
name = "Angular frequency"
expr = "2 * pi * f"
output = { symbol = "ω", name = "angular frequency", unit = "rad/s" }
variables = [{ symbol = "f", name = "frequency", unit = "Hz" }]
tags = ["mechanics", "circular_motion", "waves"]
source = { title = "Angular frequency (Wikipedia)", url = "https://en.wikipedia.org/wiki/Angular_frequency" }
checks = [{ inputs = [1], output = 6.283185307179586 }]

