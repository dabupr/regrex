id = "thermal_de_broglie_wavelength"
name = "Thermal de Broglie wavelength"
expr = "h / sqrt(2 * pi * m * k_B * T)"
output = { symbol = "L", name = "wavelength", unit = "m", aliases = ["wavelength", "lambda"] }
variables = [
  { symbol = "m", name = "particle mass", unit = "kg", aliases = ["mass", "m"] },
  { symbol = "T", name = "temperature", unit = "K", aliases = ["temperature", "T"] },
]
tags = ["quantum", "thermodynamics"]
source = { title = "Thermal de Broglie wavelength (Wikipedia)", url = "https://en.wikipedia.org/wiki/Thermal_de_Broglie_wavelength" }
checks = [{ inputs = [6.6e-27, 300], output = 5.055822971107622e-11 }]

[[formula]]
id = "remaining_after_half_lives"
name = "Fraction left after some half-lives"
expr = "0.5^(t / h)"
output = { symbol = "f", name = "fraction remaining", unit = "1", aliases = ["fraction", "remaining"] }
variables = [
  { symbol = "t", name = "elapsed time", unit = "s", aliases = ["time", "t"] },
  { symbol = "h", name = "half-life", unit = "s", aliases = ["half_life"] },
]
tags = ["nuclear"]
source = { title = "Half-life (Wikipedia)", url = "https://en.wikipedia.org/wiki/Half-life" }
checks = [{ inputs = [30, 10], output = 0.125 }]
