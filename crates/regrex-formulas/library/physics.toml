# --- Kinematics --------------------------------------------------------------

[[formula]]
id = "distance_constant_speed"
name = "Distance at constant speed"
expr = "v * t"
output = { symbol = "d", name = "distance", unit = "m", aliases = ["distance"] }
variables = [
  { symbol = "v", name = "speed", unit = "m/s", aliases = ["speed", "velocity"] },
  { symbol = "t", name = "time", unit = "s", aliases = ["time"] },
]
tags = ["mechanics", "kinematics"]
source = { title = "Speed (Wikipedia)", url = "https://en.wikipedia.org/wiki/Speed" }
checks = [{ inputs = [3, 4], output = 12 }]

[[formula]]
id = "velocity_constant_acceleration"
name = "Velocity under constant acceleration"
expr = "v0 + a * t"
output = { symbol = "v", name = "final velocity", unit = "m/s" }
variables = [
  { symbol = "v0", name = "initial velocity", unit = "m/s" },
  { symbol = "a", name = "acceleration", unit = "m/s^2" },
  { symbol = "t", name = "time", unit = "s" },
]
tags = ["mechanics", "kinematics"]
source = { title = "Equations of motion (Wikipedia)", url = "https://en.wikipedia.org/wiki/Equations_of_motion" }
checks = [{ inputs = [2, 3, 4], output = 14 }]

[[formula]]
id = "displacement_constant_acceleration"
name = "Displacement under constant acceleration"
expr = "v0 * t + a * t^2 / 2"
output = { symbol = "s", name = "displacement", unit = "m" }
variables = [
  { symbol = "v0", name = "initial velocity", unit = "m/s" },
  { symbol = "a", name = "acceleration", unit = "m/s^2" },
  { symbol = "t", name = "time", unit = "s" },
]
tags = ["mechanics", "kinematics"]
source = { title = "Equations of motion (Wikipedia)", url = "https://en.wikipedia.org/wiki/Equations_of_motion" }
checks = [{ inputs = [1, 2, 3], output = 12 }]

[[formula]]
id = "torricelli"
name = "Torricelli's equation (velocity from displacement)"
expr = "sqrt(v0^2 + 2 * a * s)"
output = { symbol = "v", name = "final speed", unit = "m/s" }
variables = [
  { symbol = "v0", name = "initial speed", unit = "m/s" },
  { symbol = "a", name = "acceleration", unit = "m/s^2" },
  { symbol = "s", name = "displacement", unit = "m" },
]
tags = ["mechanics", "kinematics"]
source = { title = "Torricelli's equation (Wikipedia)", url = "https://en.wikipedia.org/wiki/Torricelli%27s_equation" }
checks = [{ inputs = [3, 2, 4], output = 5 }]

[[formula]]
id = "free_fall_time"
name = "Time of free fall from a height"
expr = "sqrt(2 * h / g)"
output = { symbol = "t", name = "fall time", unit = "s" }
variables = [{ symbol = "h", name = "height", unit = "m", aliases = ["height"] }]
tags = ["mechanics", "kinematics", "gravity"]
source = { title = "Free fall (Wikipedia)", url = "https://en.wikipedia.org/wiki/Free_fall" }
checks = [{ inputs = [4.903325], output = 1 }]

[[formula]]
id = "free_fall_speed"
name = "Speed after falling from a height"
expr = "sqrt(2 * g * h)"
output = { symbol = "v", name = "impact speed", unit = "m/s" }
variables = [{ symbol = "h", name = "height", unit = "m", aliases = ["height"] }]
tags = ["mechanics", "kinematics", "gravity"]
source = { title = "Free fall (Wikipedia)", url = "https://en.wikipedia.org/wiki/Free_fall" }
checks = [{ inputs = [4.903325], output = 9.80665 }]

[[formula]]
id = "free_fall_distance"
name = "Distance fallen from rest"
expr = "g * t^2 / 2"
output = { symbol = "d", name = "distance fallen", unit = "m", aliases = ["distance", "height", "drop"] }
