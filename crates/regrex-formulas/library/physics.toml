# --- Gravitation -------------------------------------------------------------

[[formula]]
id = "newton_gravitation"
name = "Newton's law of universal gravitation"
expr = "G * m1 * m2 / r^2"
output = { symbol = "F", name = "gravitational force", unit = "N" }
variables = [
  { symbol = "m1", name = "first mass", unit = "kg" },
  { symbol = "m2", name = "second mass", unit = "kg" },
  { symbol = "r", name = "distance between centres", unit = "m" },
]
tags = ["gravity"]
source = { title = "Newton's law of universal gravitation (Wikipedia)", url = "https://en.wikipedia.org/wiki/Newton%27s_law_of_universal_gravitation" }
checks = [{ inputs = [1, 1, 1], output = 6.67430e-11 }]

[[formula]]
id = "orbital_speed"
name = "Speed of a circular orbit"
expr = "sqrt(G * M / r)"
output = { symbol = "v", name = "orbital speed", unit = "m/s" }
variables = [
  { symbol = "M", name = "mass of the central body", unit = "kg" },
  { symbol = "r", name = "orbit radius", unit = "m" },
]
tags = ["gravity", "astronomy"]
source = { title = "Orbital speed (Wikipedia)", url = "https://en.wikipedia.org/wiki/Orbital_speed" }

[[formula]]
id = "escape_velocity"
name = "Escape velocity"
expr = "sqrt(2 * G * M / r)"
output = { symbol = "v_e", name = "escape velocity", unit = "m/s" }
variables = [
  { symbol = "M", name = "mass of the body", unit = "kg" },
  { symbol = "r", name = "distance from the centre", unit = "m" },
]
tags = ["gravity", "astronomy"]
source = { title = "Escape velocity (Wikipedia)", url = "https://en.wikipedia.org/wiki/Escape_velocity" }

[[formula]]
id = "kepler_third_law"
name = "Kepler's third law (orbital period)"
expr = "2 * pi * sqrt(a^3 / (G * M))"
output = { symbol = "T", name = "orbital period", unit = "s" }
variables = [
  { symbol = "a", name = "semi-major axis", unit = "m" },
  { symbol = "M", name = "mass of the central body", unit = "kg" },
]
tags = ["gravity", "astronomy"]
source = { title = "Kepler's laws of planetary motion (Wikipedia)", url = "https://en.wikipedia.org/wiki/Kepler%27s_laws_of_planetary_motion" }

