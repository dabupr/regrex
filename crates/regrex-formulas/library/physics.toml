# --- Kinematics --------------------------------------------------------------

[[formula]]
id = "distance_constant_speed"
name = "Distance at constant speed"
expr = "v * t"
output = { symbol = "d", name = "distance", unit = "m", aliases = ["distance"] }
variables = [
  { symbol = "v", name = "speed", unit = "m/s", aliases = ["speed", "velocity"] },
  { symbol = "t", name = "time", unit = "s", aliases = ["time"] },
]
tags = ["mechanics", "kinematics"]
source = { title = "Speed (Wikipedia)", url = "https://en.wikipedia.org/wiki/Speed" }
checks = [{ inputs = [3, 4], output = 12 }]

[[formula]]
id = "velocity_constant_acceleration"
name = "Velocity under constant acceleration"
expr = "v0 + a * t"
output = { symbol = "v", name = "final velocity", unit = "m/s" }
variables = [
  { symbol = "v0", name = "initial velocity", unit = "m/s" },
  { symbol = "a", name = "acceleration", unit = "m/s^2" },
  { symbol = "t", name = "time", unit = "s" },
]
tags = ["mechanics", "kinematics"]
source = { title = "Equations of motion (Wikipedia)", url = "https://en.wikipedia.org/wiki/Equations_of_motion" }
checks = [{ inputs = [2, 3, 4], output = 14 }]

[[formula]]
id = "displacement_constant_acceleration"
name = "Displacement under constant acceleration"
expr = "v0 * t + a * t^2 / 2"
output = { symbol = "s", name = "displacement", unit = "m" }
variables = [
  { symbol = "v0", name = "initial velocity", unit = "m/s" },
  { symbol = "a", name = "acceleration", unit = "m/s^2" },
  { symbol = "t", name = "time", unit = "s" },
]
tags = ["mechanics", "kinematics"]
source = { title = "Equations of motion (Wikipedia)", url = "https://en.wikipedia.org/wiki/Equations_of_motion" }
checks = [{ inputs = [1, 2, 3], output = 12 }]

[[formula]]
id = "torricelli"
name = "Torricelli's equation (velocity from displacement)"
expr = "sqrt(v0^2 + 2 * a * s)"
output = { symbol = "v", name = "final speed", unit = "m/s" }
variables = [
  { symbol = "v0", name = "initial speed", unit = "m/s" },
  { symbol = "a", name = "acceleration", unit = "m/s^2" },
  { symbol = "s", name = "displacement", unit = "m" },
]
tags = ["mechanics", "kinematics"]
source = { title = "Torricelli's equation (Wikipedia)", url = "https://en.wikipedia.org/wiki/Torricelli%27s_equation" }
checks = [{ inputs = [3, 2, 4], output = 5 }]

[[formula]]
id = "free_fall_time"
name = "Time of free fall from a height"
expr = "sqrt(2 * h / g)"
output = { symbol = "t", name = "fall time", unit = "s" }
variables = [{ symbol = "h", name = "height", unit = "m", aliases = ["height"] }]
tags = ["mechanics", "kinematics", "gravity"]
source = { title = "Free fall (Wikipedia)", url = "https://en.wikipedia.org/wiki/Free_fall" }
checks = [{ inputs = [4.903325], output = 1 }]

[[formula]]
id = "free_fall_speed"
name = "Speed after falling from a height"
expr = "sqrt(2 * g * h)"
output = { symbol = "v", name = "impact speed", unit = "m/s" }
variables = [{ symbol = "h", name = "height", unit = "m", aliases = ["height"] }]
tags = ["mechanics", "kinematics", "gravity"]
source = { title = "Free fall (Wikipedia)", url = "https://en.wikipedia.org/wiki/Free_fall" }
checks = [{ inputs = [4.903325], output = 9.80665 }]

[[formula]]
id = "projectile_range"
name = "Range of a projectile on level ground"
expr = "v^2 * sin(2 * θ) / g"
output = { symbol = "R", name = "horizontal range", unit = "m" }
variables = [
  { symbol = "v", name = "launch speed", unit = "m/s" },
  { symbol = "θ", name = "launch angle", unit = "rad" },
]
tags = ["mechanics", "kinematics", "gravity"]
source = { title = "Range of a projectile (Wikipedia)", url = "https://en.wikipedia.org/wiki/Range_of_a_projectile" }
checks = [{ inputs = [9.80665, 0.7853981633974483], output = 9.80665 }]

[[formula]]
id = "projectile_max_height"
name = "Maximum height of a projectile"
expr = "v^2 * sin(θ)^2 / (2 * g)"
output = { symbol = "H", name = "maximum height", unit = "m" }
variables = [
  { symbol = "v", name = "launch speed", unit = "m/s" },
  { symbol = "θ", name = "launch angle", unit = "rad" },
]
tags = ["mechanics", "kinematics", "gravity"]
source = { title = "Projectile motion (Wikipedia)", url = "https://en.wikipedia.org/wiki/Projectile_motion" }
checks = [{ inputs = [9.80665, 1.5707963267948966], output = 4.903325 }]

[[formula]]
id = "centripetal_acceleration"
name = "Centripetal acceleration"
expr = "v^2 / r"
output = { symbol = "a_c", name = "centripetal acceleration", unit = "m/s^2" }
variables = [
  { symbol = "v", name = "speed", unit = "m/s" },
  { symbol = "r", name = "radius", unit = "m" },
]
tags = ["mechanics", "circular_motion"]
source = { title = "Centripetal force (Wikipedia)", url = "https://en.wikipedia.org/wiki/Centripetal_force" }
checks = [{ inputs = [4, 2], output = 8 }]

[[formula]]
id = "angular_frequency"
name = "Angular frequency"
expr = "2 * pi * f"
output = { symbol = "ω", name = "angular frequency", unit = "rad/s" }
variables = [{ symbol = "f", name = "frequency", unit = "Hz" }]
tags = ["mechanics", "circular_motion", "waves"]
source = { title = "Angular frequency (Wikipedia)", url = "https://en.wikipedia.org/wiki/Angular_frequency" }
checks = [{ inputs = [1], output = 6.283185307179586 }]

