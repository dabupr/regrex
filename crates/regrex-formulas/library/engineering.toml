# Engineering: structures and strength of materials, machines, fluids in
# pipes and pumps, manufacturing and civil works.
#
# Quantities use SI units unless the name says otherwise.

id = "engineering"
name = "Engineering"
description = "Strength of materials, beams, machine elements, pipes and pumps, manufacturing and civil works."

[[formula]]
id = "normal_stress"
name = "Normal stress"
expr = "F / A"
output = { symbol = "s", name = "stress", unit = "Pa", aliases = ["stress", "sigma"] }
variables = [
  { symbol = "F", name = "axial force", unit = "N", aliases = ["force", "load"] },
  { symbol = "A", name = "cross-section area", unit = "m^2", aliases = ["area"] },
]
tags = ["strength_of_materials"]
source = { title = "Stress (mechanics) (Wikipedia)", url = "https://en.wikipedia.org/wiki/Stress_(mechanics)" }
checks = [{ inputs = [50000, 0.0005], output = 100000000 }]

[[formula]]
id = "shear_stress"
name = "Average shear stress"
expr = "V / A"
output = { symbol = "t", name = "shear stress", unit = "Pa", aliases = ["shear_stress", "tau"] }
variables = [
  { symbol = "V", name = "shear force", unit = "N", aliases = ["shear_force", "force"] },
  { symbol = "A", name = "shear area", unit = "m^2", aliases = ["area"] },
]
tags = ["strength_of_materials"]
source = { title = "Shear stress (Wikipedia)", url = "https://en.wikipedia.org/wiki/Shear_stress" }
checks = [{ inputs = [20000, 0.0004], output = 50000000 }]

[[formula]]
id = "strain"
name = "Engineering strain"
expr = "d / L"
output = { symbol = "e", name = "strain", unit = "1", aliases = ["strain", "epsilon"] }
variables = [
  { symbol = "d", name = "change in length", unit = "m", aliases = ["elongation", "dl"] },
  { symbol = "L", name = "original length", unit = "m", aliases = ["length"] },
]
tags = ["strength_of_materials"]
source = { title = "Strain (mechanics) (Wikipedia)", url = "https://en.wikipedia.org/wiki/Strain_(mechanics)" }
checks = [{ inputs = [0.0012, 2], output = 0.0006 }]

[[formula]]
id = "youngs_modulus"
name = "Young's modulus"
expr = "s / e"
output = { symbol = "E", name = "Young's modulus", unit = "Pa", aliases = ["youngs_modulus", "modulus"] }
variables = [
  { symbol = "s", name = "stress", unit = "Pa", aliases = ["stress", "sigma"] },
  { symbol = "e", name = "strain", unit = "1", aliases = ["strain", "epsilon"] },
]
tags = ["strength_of_materials"]
source = { title = "Young's modulus (Wikipedia)", url = "https://en.wikipedia.org/wiki/Young's_modulus" }
checks = [{ inputs = [200000000, 0.001], output = 200000000000 }]

[[formula]]
id = "axial_elongation"
name = "Elongation of a bar under load"
expr = "F * L / (A * E)"
output = { symbol = "d", name = "elongation", unit = "m", aliases = ["elongation"] }
variables = [
  { symbol = "F", name = "axial force", unit = "N", aliases = ["force", "load"] },
  { symbol = "L", name = "length", unit = "m", aliases = ["length"] },
  { symbol = "A", name = "cross-section area", unit = "m^2", aliases = ["area"] },
  { symbol = "E", name = "Young's modulus", unit = "Pa", aliases = ["modulus", "youngs_modulus"] },
]
tags = ["strength_of_materials"]
source = { title = "Deformation (engineering) (Wikipedia)", url = "https://en.wikipedia.org/wiki/Deformation_(engineering)" }
checks = [{ inputs = [10000, 2, 0.0001, 200000000000], output = 0.001 }]

[[formula]]
id = "thermal_stress"
name = "Thermal stress in a restrained bar"
expr = "E * a * d"
