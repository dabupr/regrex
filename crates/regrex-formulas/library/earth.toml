# Earth sciences: weather and climate, oceans, geology, seismology,
# hydrology and geography.
#
# Many practical formulas use everyday units (°C, km, mm); their
# variables are plain numbers with the unit in the name.

id = "earth"
name = "Earth and weather"
description = "Weather and climate, oceans, earthquakes, geology, hydrology and maps."

[[formula]]
id = "dew_point_magnus"
name = "Dew point (Magnus)"
expr = "243.04 * (ln(h / 100) + 17.625 * t / (243.04 + t)) / (17.625 - ln(h / 100) - 17.625 * t / (243.04 + t))"
output = { symbol = "d", name = "dew point in °C", unit = "1", aliases = ["dew_point", "dewpoint"] }
variables = [
  { symbol = "t", name = "temperature in °C", unit = "1", aliases = ["temperature"] },
  { symbol = "h", name = "relative humidity in percent", unit = "1", aliases = ["humidity", "rh"] },
]
tags = ["weather", "humidity"]
source = { title = "Dew point (Wikipedia)", url = "https://en.wikipedia.org/wiki/Dew_point" }
checks = [{ inputs = [25, 60], output = 16.69766352121289 }]

[[formula]]
id = "saturation_vapour_pressure"
name = "Saturation vapour pressure (Tetens)"
expr = "0.61078 * exp(17.27 * t / (t + 237.3))"
output = { symbol = "e", name = "pressure in kPa", unit = "1", aliases = ["vapour_pressure"] }
variables = [
  { symbol = "t", name = "temperature in °C", unit = "1", aliases = ["temperature"] },
]
tags = ["weather", "humidity"]
source = { title = "Vapour pressure of water (Wikipedia)", url = "https://en.wikipedia.org/wiki/Vapour_pressure_of_water" }
checks = [{ inputs = [20], output = 2.3382047063802642 }]

[[formula]]
id = "relative_humidity"
name = "Relative humidity"
expr = "100 * e / s"
output = { symbol = "h", name = "relative humidity in percent", unit = "1", aliases = ["humidity", "rh"] }
variables = [
  { symbol = "e", name = "vapour pressure", unit = "Pa", aliases = ["vapour_pressure"] },
  { symbol = "s", name = "saturation vapour pressure", unit = "Pa", aliases = ["saturation"] },
]
tags = ["weather", "humidity"]
source = { title = "Humidity (Wikipedia)", url = "https://en.wikipedia.org/wiki/Humidity" }
checks = [{ inputs = [1500, 2339], output = 64.12997007268063 }]

[[formula]]
id = "heat_index_simple"
name = "Heat index (Steadman, simple)"
expr = "0.5 * (f + 61 + (f - 68) * 1.2 + h * 0.094)"
output = { symbol = "i", name = "heat index in °F", unit = "1", aliases = ["heat_index"] }
variables = [
  { symbol = "f", name = "temperature in °F", unit = "1", aliases = ["temperature"] },
  { symbol = "h", name = "relative humidity in percent", unit = "1", aliases = ["humidity", "rh"] },
]
tags = ["weather", "comfort"]
source = { title = "Heat index (Wikipedia)", url = "https://en.wikipedia.org/wiki/Heat_index" }
checks = [{ inputs = [85, 50], output = 85.55 }]

[[formula]]
id = "wind_chill"
name = "Wind chill (metric)"
expr = "13.12 + 0.6215 * t - 11.37 * v^0.16 + 0.3965 * t * v^0.16"
output = { symbol = "w", name = "wind chill in °C", unit = "1", aliases = ["wind_chill", "feels_like"] }
variables = [
  { symbol = "t", name = "air temperature in °C", unit = "1", aliases = ["temperature"] },
  { symbol = "v", name = "wind speed in km/h", unit = "1", aliases = ["wind", "speed"] },
]
tags = ["weather", "comfort"]
source = { title = "Wind chill (Wikipedia)", url = "https://en.wikipedia.org/wiki/Wind_chill" }
checks = [{ inputs = [-5, 30], output = -12.996724811921073 }]

[[formula]]
id = "humidex"
name = "Humidex"
expr = "t + 0.5555 * (6.11 * exp(5417.753 * (1 / 273.16 - 1 / (273.15 + d))) - 10)"
