variables = [
  { symbol = "a", name = "first latitude in radians", unit = "1", aliases = ["lat1"] },
  { symbol = "b", name = "second latitude in radians", unit = "1", aliases = ["lat2"] },
  { symbol = "c", name = "first longitude in radians", unit = "1", aliases = ["lon1"] },
  { symbol = "d", name = "second longitude in radians", unit = "1", aliases = ["lon2"] },
]
tags = ["geography", "maps"]
source = { title = "Haversine formula (Wikipedia)", url = "https://en.wikipedia.org/wiki/Haversine_formula" }
checks = [{ inputs = [0.7223, 0.8527, 0.0382, 0.0408], output = 830.860148282479 }]

