[[formula]]
id = "specificity"
name = "Specificity (true negative rate)"
expr = "n / (n + f)"
output = { symbol = "s", name = "specificity", unit = "1", aliases = ["specificity", "tnr"] }
variables = [
  { symbol = "n", name = "true negatives", unit = "1", aliases = ["tn", "true_negatives"] },
  { symbol = "f", name = "false positives", unit = "1", aliases = ["fp", "false_positives"] },
]
tags = ["statistics", "classification"]
source = { title = "Sensitivity and specificity (Wikipedia)", url = "https://en.wikipedia.org/wiki/Sensitivity_and_specificity" }
checks = [{ inputs = [90, 10], output = 0.9 }]

[[formula]]
id = "false_positive_rate"
name = "False positive rate"
expr = "f / (f + n)"
output = { symbol = "r", name = "false positive rate", unit = "1", aliases = ["fpr"] }
variables = [
  { symbol = "f", name = "false positives", unit = "1", aliases = ["fp", "false_positives"] },
  { symbol = "n", name = "true negatives", unit = "1", aliases = ["tn", "true_negatives"] },
]
tags = ["statistics", "classification"]
source = { title = "False positive rate (Wikipedia)", url = "https://en.wikipedia.org/wiki/False_positive_rate" }
