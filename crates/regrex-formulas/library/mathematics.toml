# --- Algebra and analysis ----------------------------------------------------

[[formula]]
id = "quadratic_root"
name = "Quadratic formula (larger root)"
expr = "(-b + sqrt(b^2 - 4 * a * c)) / (2 * a)"
output = { symbol = "x", name = "root of a x² + b x + c = 0", unit = "1" }
variables = [
  { symbol = "a", name = "quadratic coefficient", unit = "1" },
  { symbol = "b", name = "linear coefficient", unit = "1" },
  { symbol = "c", name = "constant term", unit = "1" },
]
tags = ["algebra"]
source = { title = "Quadratic formula (Wikipedia)", url = "https://en.wikipedia.org/wiki/Quadratic_formula" }
checks = [{ inputs = [1, -3, 2], output = 2 }]

[[formula]]
id = "arithmetic_series"
name = "Sum of an arithmetic series"
expr = "n * (a1 + an) / 2"
output = { symbol = "S", name = "sum of the n terms", unit = "1" }
variables = [
  { symbol = "n", name = "number of terms", unit = "1" },
  { symbol = "a1", name = "first term", unit = "1" },
  { symbol = "an", name = "last term", unit = "1" },
]
tags = ["algebra", "series"]
source = { title = "Arithmetic progression (Wikipedia)", url = "https://en.wikipedia.org/wiki/Arithmetic_progression" }
checks = [{ inputs = [100, 1, 100], output = 5050 }]

[[formula]]
id = "geometric_series"
name = "Sum of a geometric series"
expr = "a * (1 - r^n) / (1 - r)"
output = { symbol = "S", name = "sum of the n terms", unit = "1" }
variables = [
  { symbol = "a", name = "first term", unit = "1" },
  { symbol = "r", name = "common ratio", unit = "1" },
  { symbol = "n", name = "number of terms", unit = "1" },
]
tags = ["algebra", "series"]
source = { title = "Geometric series (Wikipedia)", url = "https://en.wikipedia.org/wiki/Geometric_series" }
checks = [{ inputs = [1, 2, 10], output = 1023 }]

[[formula]]
id = "sum_of_first_n"
name = "Sum of the first n natural numbers"
expr = "n * (n + 1) / 2"
output = { symbol = "S", name = "1 + 2 + … + n", unit = "1" }
variables = [{ symbol = "n", name = "n", unit = "1" }]
tags = ["algebra", "series"]
source = { title = "Triangular number (Wikipedia)", url = "https://en.wikipedia.org/wiki/Triangular_number" }
checks = [{ inputs = [10], output = 55 }]

[[formula]]
id = "sum_of_squares"
name = "Sum of the first n squares"
expr = "n * (n + 1) * (2 * n + 1) / 6"
output = { symbol = "S", name = "1² + 2² + … + n²", unit = "1" }
variables = [{ symbol = "n", name = "n", unit = "1" }]
tags = ["algebra", "series"]
source = { title = "Square pyramidal number (Wikipedia)", url = "https://en.wikipedia.org/wiki/Square_pyramidal_number" }
checks = [{ inputs = [3], output = 14 }]

[[formula]]
id = "exponential_growth"
name = "Exponential growth"
expr = "N0 * exp(k * t)"
output = { symbol = "N", name = "quantity at time t", unit = "1" }
variables = [
  { symbol = "N0", name = "initial quantity", unit = "1" },
  { symbol = "k", name = "growth rate", unit = "1/s" },
  { symbol = "t", name = "time", unit = "s" },
]
tags = ["analysis", "growth"]
source = { title = "Exponential growth (Wikipedia)", url = "https://en.wikipedia.org/wiki/Exponential_growth" }
checks = [{ inputs = [10, 0, 5], output = 10 }]

[[formula]]
id = "logistic"
name = "Logistic function"
expr = "L / (1 + exp(-k * (x - x0)))"
output = { symbol = "y", name = "value", unit = "1" }
variables = [
  { symbol = "L", name = "maximum value", unit = "1" },
  { symbol = "k", name = "steepness", unit = "1" },
  { symbol = "x", name = "input", unit = "1" },
  { symbol = "x0", name = "midpoint", unit = "1" },
]
tags = ["analysis", "growth"]
source = { title = "Logistic function (Wikipedia)", url = "https://en.wikipedia.org/wiki/Logistic_function" }
checks = [{ inputs = [10, 1, 3, 3], output = 5 }]

[[formula]]
id = "log_change_of_base"
name = "Logarithm in any base"
expr = "log(x) / log(b)"
output = { symbol = "y", name = "log base b of x", unit = "1" }
variables = [
  { symbol = "x", name = "argument", unit = "1" },
  { symbol = "b", name = "base", unit = "1" },
]
tags = ["algebra"]
source = { title = "Logarithm: change of base (Wikipedia)", url = "https://en.wikipedia.org/wiki/Logarithm" }
checks = [{ inputs = [8, 2], output = 3 }]

# --- Statistics and probability ----------------------------------------------

[[formula]]
id = "z_score"
name = "Standard score (z-score)"
expr = "(x - μ) / σ"
output = { symbol = "z", name = "standard score", unit = "1" }
variables = [
  { symbol = "x", name = "value", unit = "1" },
  { symbol = "μ", name = "mean", unit = "1", aliases = ["mean"] },
  { symbol = "σ", name = "standard deviation", unit = "1", aliases = ["std", "sd"] },
]
tags = ["statistics"]
source = { title = "Standard score (Wikipedia)", url = "https://en.wikipedia.org/wiki/Standard_score" }
checks = [{ inputs = [130, 100, 15], output = 2 }]

[[formula]]
id = "normal_pdf"
name = "Normal probability density"
expr = "exp(-(x - μ)^2 / (2 * σ^2)) / (σ * sqrt(2 * pi))"
output = { symbol = "f", name = "probability density", unit = "1" }
variables = [
  { symbol = "x", name = "value", unit = "1" },
  { symbol = "μ", name = "mean", unit = "1" },
  { symbol = "σ", name = "standard deviation", unit = "1" },
]
tags = ["statistics", "probability"]
source = { title = "Normal distribution (Wikipedia)", url = "https://en.wikipedia.org/wiki/Normal_distribution" }
checks = [{ inputs = [0, 0, 1], output = 0.3989422804014327 }]

[[formula]]
id = "exponential_pdf"
name = "Exponential probability density"
expr = "λ * exp(-λ * x)"
output = { symbol = "f", name = "probability density", unit = "1" }
variables = [
  { symbol = "λ", name = "rate", unit = "1" },
  { symbol = "x", name = "value", unit = "1" },
]
tags = ["statistics", "probability"]
source = { title = "Exponential distribution (Wikipedia)", url = "https://en.wikipedia.org/wiki/Exponential_distribution" }
checks = [{ inputs = [2, 0], output = 2 }]

[[formula]]
id = "standard_error"
name = "Standard error of the mean"
expr = "σ / sqrt(n)"
output = { symbol = "SE", name = "standard error", unit = "1" }
variables = [
  { symbol = "σ", name = "standard deviation", unit = "1" },
  { symbol = "n", name = "sample size", unit = "1" },
]
tags = ["statistics"]
source = { title = "Standard error (Wikipedia)", url = "https://en.wikipedia.org/wiki/Standard_error" }
checks = [{ inputs = [10, 25], output = 2 }]

[[formula]]
id = "percent_change"
name = "Percentage change"
expr = "(new - old) / old * 100"
output = { symbol = "p", name = "change in percent", unit = "1" }
variables = [
  { symbol = "old", name = "old value", unit = "1", aliases = ["before", "previous"] },
  { symbol = "new", name = "new value", unit = "1", aliases = ["after", "current"] },
]
tags = ["statistics", "everyday"]
source = { title = "Relative change (Wikipedia)", url = "https://en.wikipedia.org/wiki/Relative_change" }
checks = [{ inputs = [80, 100], output = 25 }]

[[formula]]
id = "weighted_mean_2"
name = "Weighted mean of two values"
expr = "(w1 * x1 + w2 * x2) / (w1 + w2)"
output = { symbol = "m", name = "weighted mean", unit = "1" }
variables = [
  { symbol = "x1", name = "first value", unit = "1" },
  { symbol = "w1", name = "first weight", unit = "1" },
  { symbol = "x2", name = "second value", unit = "1" },
  { symbol = "w2", name = "second weight", unit = "1" },
]
tags = ["statistics"]
source = { title = "Weighted arithmetic mean (Wikipedia)", url = "https://en.wikipedia.org/wiki/Weighted_arithmetic_mean" }
checks = [{ inputs = [10, 1, 20, 3], output = 17.5 }]

[[formula]]
id = "binomial_variance"
name = "Variance of a binomial distribution"
expr = "n * p * (1 - p)"
output = { symbol = "var", name = "variance", unit = "1" }
variables = [
  { symbol = "n", name = "number of trials", unit = "1" },
  { symbol = "p", name = "probability of success", unit = "1" },
]
tags = ["statistics", "probability"]
source = { title = "Binomial distribution (Wikipedia)", url = "https://en.wikipedia.org/wiki/Binomial_distribution" }
checks = [{ inputs = [100, 0.5], output = 25 }]

[[formula]]
id = "square_area"
name = "Area of a square"
expr = "a^2"
