[[formula]]
id = "relative_error"
name = "Relative error"
expr = "abs(m - t) / abs(t)"
output = { symbol = "e", name = "relative error", unit = "1", aliases = ["relative_error", "error"] }
variables = [
  { symbol = "m", name = "measured value", unit = "1", aliases = ["measured", "approx"] },
  { symbol = "t", name = "true value", unit = "1", aliases = ["true", "exact"] },
]
tags = ["statistics"]
source = { title = "Approximation error (Wikipedia)", url = "https://en.wikipedia.org/wiki/Approximation_error" }
checks = [{ inputs = [9.8, 10], output = 0.019999999999999928 }]

[[formula]]
id = "percent_error"
name = "Percent error"
expr = "100 * abs(m - t) / abs(t)"
output = { symbol = "e", name = "percent error", unit = "1", aliases = ["percent_error", "error"] }
variables = [
  { symbol = "m", name = "measured value", unit = "1", aliases = ["measured", "approx"] },
  { symbol = "t", name = "true value", unit = "1", aliases = ["true", "exact"] },
]
