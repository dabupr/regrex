[[formula]]
id = "sphere_surface"
name = "Surface area of a sphere"
expr = "4 * pi * r^2"
output = { symbol = "A", name = "surface area", unit = "m^2" }
variables = [{ symbol = "r", name = "radius", unit = "m" }]
tags = ["geometry", "solid"]
source = { title = "Sphere (Wikipedia)", url = "https://en.wikipedia.org/wiki/Sphere" }
