# Mathematics: geometry, algebra, trigonometry and probability.
#
# Format: see README.md in this crate. Lengths are in metres so that
# areas and volumes check dimensionally, but any consistent unit works.

id = "mathematics"
name = "Mathematics"
description = "Geometry, algebra, trigonometry, probability and statistics."

# --- Constants ---------------------------------------------------------------

[[constant]]
id = "pi"
symbol = "π"
name = "ratio of a circle's circumference to its diameter"
value = 3.141592653589793
unit = "1"
exact = true
source = { title = "Pi (Wikipedia)", url = "https://en.wikipedia.org/wiki/Pi" }

[[constant]]
id = "e"
symbol = "e"
name = "Euler's number, base of the natural logarithm"
value = 2.718281828459045
unit = "1"
exact = true
source = { title = "E (mathematical constant) (Wikipedia)", url = "https://en.wikipedia.org/wiki/E_(mathematical_constant)" }

[[constant]]
id = "phi"
symbol = "φ"
name = "golden ratio, (1 + √5) / 2"
value = 1.618033988749895
unit = "1"
exact = true
source = { title = "Golden ratio (Wikipedia)", url = "https://en.wikipedia.org/wiki/Golden_ratio" }

[[constant]]
id = "sqrt2"
symbol = "√2"
name = "square root of 2"
value = 1.4142135623730951
unit = "1"
exact = true
source = { title = "Square root of 2 (Wikipedia)", url = "https://en.wikipedia.org/wiki/Square_root_of_2" }

# --- Plane geometry ----------------------------------------------------------

[[formula]]
id = "circle_area"
name = "Area of a circle"
expr = "pi * r^2"
output = { symbol = "A", name = "area", unit = "m^2" }
variables = [{ symbol = "r", name = "radius", unit = "m", aliases = ["radius"] }]
tags = ["geometry"]
source = { title = "Area of a circle (Wikipedia)", url = "https://en.wikipedia.org/wiki/Area_of_a_circle" }
checks = [{ inputs = [2], output = 12.566370614359172 }]

[[formula]]
id = "circle_circumference"
name = "Circumference of a circle"
expr = "2 * pi * r"
output = { symbol = "C", name = "circumference", unit = "m" }
variables = [{ symbol = "r", name = "radius", unit = "m", aliases = ["radius"] }]
tags = ["geometry"]
source = { title = "Circumference (Wikipedia)", url = "https://en.wikipedia.org/wiki/Circumference" }
checks = [{ inputs = [1], output = 6.283185307179586 }]

[[formula]]
id = "rectangle_area"
name = "Area of a rectangle"
expr = "a * b"
output = { symbol = "A", name = "area", unit = "m^2" }
variables = [
  { symbol = "a", name = "length", unit = "m", aliases = ["length", "long"] },
  { symbol = "b", name = "width", unit = "m", aliases = ["width", "wide"] },
]
tags = ["geometry"]
source = { title = "Rectangle (Wikipedia)", url = "https://en.wikipedia.org/wiki/Rectangle" }
checks = [{ inputs = [3, 4], output = 12 }]

[[formula]]
id = "rectangle_perimeter"
name = "Perimeter of a rectangle"
expr = "2 * (a + b)"
output = { symbol = "P", name = "perimeter", unit = "m" }
variables = [
  { symbol = "a", name = "length", unit = "m" },
  { symbol = "b", name = "width", unit = "m" },
]
tags = ["geometry"]
source = { title = "Perimeter (Wikipedia)", url = "https://en.wikipedia.org/wiki/Perimeter" }
checks = [{ inputs = [3, 4], output = 14 }]

[[formula]]
id = "triangle_area"
name = "Area of a triangle (base and height)"
expr = "b * h / 2"
output = { symbol = "A", name = "area", unit = "m^2" }
variables = [
  { symbol = "b", name = "base", unit = "m", aliases = ["base"] },
  { symbol = "h", name = "height", unit = "m", aliases = ["height"] },
]
tags = ["geometry"]
source = { title = "Triangle: area (Wikipedia)", url = "https://en.wikipedia.org/wiki/Triangle" }
checks = [{ inputs = [6, 4], output = 12 }]

[[formula]]
id = "heron"
name = "Heron's formula"
description = "Area of a triangle from its three sides."
expr = "sqrt(s * (s - a) * (s - b) * (s - c))"
output = { symbol = "A", name = "area", unit = "m^2" }
variables = [
  { symbol = "a", name = "side a", unit = "m" },
  { symbol = "b", name = "side b", unit = "m" },
  { symbol = "c", name = "side c", unit = "m" },
  { symbol = "s", name = "semi-perimeter (a + b + c) / 2", unit = "m" },
]
tags = ["geometry"]
source = { title = "Heron's formula (Wikipedia)", url = "https://en.wikipedia.org/wiki/Heron%27s_formula" }
checks = [{ inputs = [3, 4, 5, 6], output = 6 }]

[[formula]]
id = "trapezoid_area"
name = "Area of a trapezoid"
expr = "(a + b) / 2 * h"
output = { symbol = "A", name = "area", unit = "m^2" }
variables = [
  { symbol = "a", name = "first parallel side", unit = "m" },
  { symbol = "b", name = "second parallel side", unit = "m" },
  { symbol = "h", name = "height", unit = "m" },
]
tags = ["geometry"]
source = { title = "Trapezoid (Wikipedia)", url = "https://en.wikipedia.org/wiki/Trapezoid" }
checks = [{ inputs = [3, 5, 2], output = 8 }]

[[formula]]
id = "pythagoras"
name = "Pythagorean theorem (hypotenuse)"
expr = "sqrt(a^2 + b^2)"
output = { symbol = "c", name = "hypotenuse", unit = "m" }
variables = [
  { symbol = "a", name = "first leg", unit = "m" },
  { symbol = "b", name = "second leg", unit = "m" },
]
tags = ["geometry", "trigonometry"]
source = { title = "Pythagorean theorem (Wikipedia)", url = "https://en.wikipedia.org/wiki/Pythagorean_theorem" }
checks = [{ inputs = [3, 4], output = 5 }]

[[formula]]
id = "distance_2d"
name = "Distance between two points in the plane"
expr = "sqrt((x2 - x1)^2 + (y2 - y1)^2)"
output = { symbol = "d", name = "distance", unit = "m" }
variables = [
  { symbol = "x1", name = "x of the first point", unit = "m" },
  { symbol = "y1", name = "y of the first point", unit = "m" },
  { symbol = "x2", name = "x of the second point", unit = "m" },
  { symbol = "y2", name = "y of the second point", unit = "m" },
]
tags = ["geometry"]
source = { title = "Euclidean distance (Wikipedia)", url = "https://en.wikipedia.org/wiki/Euclidean_distance" }
checks = [{ inputs = [1, 1, 4, 5], output = 5 }]

[[formula]]
id = "law_of_cosines"
name = "Law of cosines"
expr = "sqrt(a^2 + b^2 - 2 * a * b * cos(γ))"
output = { symbol = "c", name = "side opposite to γ", unit = "m" }
variables = [
  { symbol = "a", name = "side a", unit = "m" },
  { symbol = "b", name = "side b", unit = "m" },
  { symbol = "γ", name = "angle between a and b", unit = "rad" },
]
tags = ["geometry", "trigonometry"]
source = { title = "Law of cosines (Wikipedia)", url = "https://en.wikipedia.org/wiki/Law_of_cosines" }
checks = [{ inputs = [3, 4, 1.5707963267948966], output = 5 }]

[[formula]]
id = "regular_polygon_area"
name = "Area of a regular polygon"
expr = "n * s^2 / (4 * tan(pi / n))"
output = { symbol = "A", name = "area", unit = "m^2" }
variables = [
  { symbol = "n", name = "number of sides", unit = "1" },
  { symbol = "s", name = "side length", unit = "m" },
]
tags = ["geometry"]
source = { title = "Regular polygon: area (Wikipedia)", url = "https://en.wikipedia.org/wiki/Regular_polygon" }
checks = [{ inputs = [4, 3], output = 9 }]

[[formula]]
id = "arc_length"
name = "Length of a circular arc"
expr = "r * θ"
output = { symbol = "L", name = "arc length", unit = "m" }
variables = [
  { symbol = "r", name = "radius", unit = "m" },
  { symbol = "θ", name = "central angle", unit = "rad" },
]
tags = ["geometry"]
source = { title = "Arc length (Wikipedia)", url = "https://en.wikipedia.org/wiki/Arc_length" }
checks = [{ inputs = [2, 1.5], output = 3 }]

[[formula]]
id = "ellipse_area"
name = "Area of an ellipse"
expr = "pi * a * b"
output = { symbol = "A", name = "area", unit = "m^2" }
variables = [
  { symbol = "a", name = "semi-major axis", unit = "m" },
  { symbol = "b", name = "semi-minor axis", unit = "m" },
]
tags = ["geometry"]
source = { title = "Ellipse: area (Wikipedia)", url = "https://en.wikipedia.org/wiki/Ellipse" }
checks = [{ inputs = [1, 1], output = 3.141592653589793 }]

# --- Solid geometry ----------------------------------------------------------

[[formula]]
