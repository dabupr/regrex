[[formula]]
id = "cohens_d"
name = "Effect size (Cohen's d)"
expr = "(m1 - m2) / s"
output = { symbol = "d", name = "effect size", unit = "1", aliases = ["cohens_d", "effect"] }
variables = [
  { symbol = "m1", name = "first mean", unit = "1", aliases = ["mean1", "m1"] },
  { symbol = "m2", name = "second mean", unit = "1", aliases = ["mean2", "m2"] },
  { symbol = "s", name = "pooled standard deviation", unit = "1", aliases = ["sd", "pooled_sd"] },
]
tags = ["statistics"]
source = { title = "Effect size (Wikipedia)", url = "https://en.wikipedia.org/wiki/Effect_size" }
checks = [{ inputs = [105, 100, 15], output = 0.3333333333333333 }]

[[formula]]
id = "root_mean_square_2"
name = "Root mean square of two values"
expr = "sqrt((a^2 + b^2) / 2)"
output = { symbol = "r", name = "root mean square", unit = "1", aliases = ["rms"] }
variables = [
  { symbol = "a", name = "first value", unit = "1", aliases = ["a"] },
  { symbol = "b", name = "second value", unit = "1", aliases = ["b"] },
]
tags = ["statistics"]
source = { title = "Root mean square (Wikipedia)", url = "https://en.wikipedia.org/wiki/Root_mean_square" }
