[[formula]]
id = "mebibytes_to_gibibytes"
name = "Mebibytes to gibibytes"
expr = "m / 1024"
output = { symbol = "g", name = "gibibytes", unit = "1", aliases = ["gib", "gibibytes", "gb"] }
variables = [
  { symbol = "m", name = "mebibytes", unit = "1", aliases = ["mib", "mebibytes", "mb"] },
]
tags = ["data"]
source = { title = "Gibibyte (Wikipedia)", url = "https://en.wikipedia.org/wiki/Gibibyte" }
checks = [{ inputs = [4096], output = 4 }]

[[formula]]
id = "download_time_mbps"
