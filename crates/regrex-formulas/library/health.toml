[[formula]]
id = "creatinine_clearance_cockcroft_gault"
name = "Creatinine clearance, Cockcroft–Gault (men)"
expr = "(140 - age) * m / (72 * Cr)"
output = { symbol = "CrCl", name = "creatinine clearance in mL/min", unit = "1", aliases = ["crcl"] }
variables = [
  { symbol = "age", name = "age in years", unit = "1" },
  { symbol = "m", name = "body mass in kg", unit = "1", aliases = ["weight"] },
  { symbol = "Cr", name = "serum creatinine in mg/dL", unit = "1", aliases = ["creatinine"] },
]
