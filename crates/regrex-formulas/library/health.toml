# Health and sport: empirical formulas common in clinical and fitness
# datasets.
#
# Most of these are regressions whose coefficients carry units, so the
# variables are declared as plain numbers ("1") with the expected unit in
# the name. Use them with values in exactly those units.

id = "health"
name = "Health and sport"
description = "Body mass index, energy expenditure, heart rate and other empirical health formulas."

[[formula]]
id = "body_mass_index"
name = "Body mass index"
expr = "m / h^2"
output = { symbol = "BMI", name = "body mass index", unit = "kg/m^2", aliases = ["bmi", "imc"] }
variables = [
  { symbol = "m", name = "body mass", unit = "kg", aliases = ["weight", "mass", "pes"] },
  { symbol = "h", name = "height", unit = "m", aliases = ["height", "alcada"] },
]
tags = ["anthropometry"]
source = { title = "Body mass index (Wikipedia)", url = "https://en.wikipedia.org/wiki/Body_mass_index" }
checks = [{ inputs = [72, 1.8], output = 22.22222222222222 }]

[[formula]]
id = "bmr_mifflin_men"
name = "Basal metabolic rate, Mifflin–St Jeor (men)"
expr = "10 * m + 6.25 * h - 5 * age + 5"
output = { symbol = "BMR", name = "basal metabolic rate in kcal/day", unit = "1" }
variables = [
  { symbol = "m", name = "body mass in kg", unit = "1", aliases = ["weight"] },
  { symbol = "h", name = "height in cm", unit = "1", aliases = ["height"] },
  { symbol = "age", name = "age in years", unit = "1" },
]
tags = ["metabolism"]
source = { title = "Mifflin MD et al., Am J Clin Nutr 51 (1990) 241–247", url = "https://doi.org/10.1093/ajcn/51.2.241" }
checks = [{ inputs = [70, 175, 30], output = 1648.75 }]

[[formula]]
id = "bmr_mifflin_women"
name = "Basal metabolic rate, Mifflin–St Jeor (women)"
expr = "10 * m + 6.25 * h - 5 * age - 161"
output = { symbol = "BMR", name = "basal metabolic rate in kcal/day", unit = "1" }
variables = [
  { symbol = "m", name = "body mass in kg", unit = "1", aliases = ["weight"] },
  { symbol = "h", name = "height in cm", unit = "1", aliases = ["height"] },
  { symbol = "age", name = "age in years", unit = "1" },
]
tags = ["metabolism"]
source = { title = "Mifflin MD et al., Am J Clin Nutr 51 (1990) 241–247", url = "https://doi.org/10.1093/ajcn/51.2.241" }
checks = [{ inputs = [60, 165, 30], output = 1320.25 }]

[[formula]]
id = "max_heart_rate_fox"
name = "Maximum heart rate (220 − age)"
expr = "220 - age"
