[[formula]]
id = "blood_alcohol_widmark"
name = "Blood alcohol content, Widmark"
expr = "A / (r * m) - beta * t"
output = { symbol = "BAC", name = "blood alcohol in g/kg", unit = "1", aliases = ["bac"] }
