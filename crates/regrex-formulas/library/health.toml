[[formula]]
id = "body_surface_area_du_bois"
name = "Body surface area, Du Bois"
expr = "0.007184 * m^0.425 * h^0.725"
output = { symbol = "BSA", name = "body surface area in m²", unit = "1", aliases = ["bsa"] }
