  { symbol = "A", name = "alcohol consumed in g", unit = "1", aliases = ["alcohol", "grams"] },
  { symbol = "r", name = "Widmark factor (0.68 men, 0.55 women)", unit = "1", aliases = ["widmark"] },
  { symbol = "m", name = "body mass in kg", unit = "1", aliases = ["weight"] },
  { symbol = "beta", name = "elimination rate in g/kg per hour", unit = "1", aliases = ["elimination"] },
  { symbol = "t", name = "hours since drinking", unit = "1", aliases = ["hours", "time"] },
]
