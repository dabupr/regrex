[package]
name = "regrex-wasm"
version.workspace = true
description = "WebAssembly bindings for Regrex, used by the web app"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regrex-core = { path = "../regrex-core", version = "0.0.1", default-features = false }
regrex-io = { path = "../regrex-io", version = "0.0.1" }
regrex-formulas = { path = "../regrex-formulas", version = "0.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
