[package]
name = "regrex-io"
version.workspace = true
description = "Read CSV files and spreadsheets into Regrex tables"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "../../README.md"
homepage = "https://dabupr.github.io/regrex/"
documentation = "https://docs.rs/regrex-io"
keywords = ["csv", "excel", "spreadsheet", "symbolic-regression"]
categories = ["parser-implementations", "science"]

[dependencies]
regrex-core = { path = "../regrex-core", version = "0.0.1", default-features = false }
regrex-formulas = { path = "../regrex-formulas", version = "0.0.1" }
calamine = "0.38"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Optional readers, off by default to keep the WebAssembly build small.
arrow-array = { version = "60", optional = true }
arrow-cast = { version = "60", default-features = false, optional = true }
arrow-ipc = { version = "60", features = ["lz4", "zstd"], optional = true }
parquet = { version = "60", optional = true }
rusqlite = { version = "0.40", features = ["bundled", "serialize"], optional = true }
bytes = { version = "1", optional = true }

[features]
# Apache Parquet files (.parquet).
parquet = ["dep:parquet", "dep:bytes", "dep:arrow-array", "dep:arrow-cast"]
# Arrow IPC files and streams (.arrow, .feather, .arrows).
arrow = ["dep:arrow-ipc", "dep:arrow-array", "dep:arrow-cast"]
# SQLite databases (.sqlite, .db): each table is like a sheet.
sqlite = ["dep:rusqlite"]
# Every optional format.
all-formats = ["parquet", "arrow", "sqlite"]

[dev-dependencies]
# Used by tests/formats.rs to write files in each optional format.
arrow-array = "60"
arrow-ipc = "60"
parquet = "60"
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
