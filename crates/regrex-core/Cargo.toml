[package]
name = "regrex-core"
version = "0.0.1"
description = "Symbolic regression core for Regrex"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["symbolic-regression", "formula", "equation-discovery", "wasm"]
categories = ["science", "mathematics", "algorithms"]

[features]
default = ["parallel"]
## Use all CPU cores (disable for WebAssembly).
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1.10", optional = true }
