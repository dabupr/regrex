[package]
name = "regrex-core"
version.workspace = true
description = "Symbolic regression engine of Regrex: find the formulas behind tabular data"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
readme = "../../README.md"
homepage = "https://dabupr.github.io/regrex/"
documentation = "https://docs.rs/regrex-core"
keywords = ["symbolic-regression", "formula", "equation-discovery", "wasm"]
categories = ["science", "mathematics", "algorithms"]

[features]
default = ["parallel"]
## Use all CPU cores (disable for WebAssembly).
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1.10", optional = true }
